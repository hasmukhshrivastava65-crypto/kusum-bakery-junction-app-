name: Build Kusum Bakery Junction APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Demo google-services.json if missing
        run: |
          if [ ! -f app/google-services.json ]; then
            python3 -c '
          import json
          cfg = {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "kusum-bakery-junction-prod",
              "storage_bucket": "kusum-bakery-junction-prod.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:abcdef1234567890",
                "android_client_info": {"package_name": "in.kusumbakeryjunction.app"}
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyDemoKeyForCloudBuildTestingOnly12345"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          open("app/google-services.json", "w").write(json.dumps(cfg, indent=2))
          '
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Run Automated Unit Tests
        run: gradle testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KusumBakeryJunction-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
